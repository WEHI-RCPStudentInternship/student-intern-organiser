{% extends 'base.html' %}

{% block title %}Add Status{% endblock %}

{% block page_title %}Add Status{% endblock %}

{% block top_links_menu %}
    <!-- Your top links menu goes here if needed -->
{% endblock %}

{% block content %}
    <h1>Add Status</h1>
    <form method="POST" action="/add_status">
        <div class="form-group">
            <label for="name">Status Name:</label>
            <input type="text" class="form-control" id="name" name="name" required>
            <small class="form-text text-muted">Format: ## Description, e.g., '01 Received application'</small>
        </div>
        <button type="submit" class="btn btn-primary">Add Status</button>
    </form>
{% endblock %}
